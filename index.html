<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Incident Lab is a supportive assessment and development tool for Virtual Desktop Service engineers.">
  <title>Incident Lab — VDS readiness</title>
  <!-- Apply the saved theme before CSS loads, so the page does not flash white. -->
  <script>
    try {
      var storedTheme = localStorage.getItem("incident-lab:theme");
      document.documentElement.dataset.theme = storedTheme === "light" ? "light" : "dark";
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/styles.css?v=13">
  <link rel="icon" href="assets/lloyds-horse.svg">
</head>
<body>
  <!-- Skip link is for keyboard users. The app replaces #app on every page draw. -->
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app">
    <p class="boot-status">Loading Incident Lab…</p>
  </div>
  <!-- MSAL must load before the app module so window.msal exists. The ?v= query avoids a stale cached copy. -->
  <script src="js/vendor/msal-browser.min.js"></script>
  <script type="module" src="js/app.js?v=13"></script>
</body>
</html>
